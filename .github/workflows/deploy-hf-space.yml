name: Deploy to Hugging Face Space

# Manual only: Docker Spaces on free cpu-basic now require a Hugging Face PRO plan.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare Space files
        run: |
          mkdir -p space
          cp Dockerfile main.py requirements.txt space/
          mkdir -p space/model_bundle
          cp model_bundle/model.onnx model_bundle/model_config.json space/model_bundle/
          cp deploy/huggingface/README.md space/README.md

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME || 'veya-api' }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN secret is not set — skipping deploy."
            exit 0
          fi
          pip install -q -U huggingface_hub
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          user = api.whoami()["name"]
          space = f"{user}/{os.environ['HF_SPACE_NAME']}"

          # Free CPU (2 vCPU / 16 GB) must be set at creation time:
          # free accounts can't switch hardware afterwards, and ZeroGPU needs Gradio.
          api.create_repo(space, repo_type="space", space_sdk="docker",
                          space_hardware="cpu-basic", exist_ok=True)
          requested = api.get_space_runtime(space).requested_hardware
          print(f"Space hardware: {requested}")
          if requested not in (None, "cpu-basic"):
              print(f"::warning::Space hardware is {requested}, expected cpu-basic. "
                    "Change it in the Space settings or recreate the Space.")
          api.upload_folder(
              repo_id=space,
              repo_type="space",
              folder_path="space",
              delete_patterns="*",
              commit_message=f"Deploy {os.environ.get('GITHUB_SHA', '')[:7]} from GitHub",
          )
          url = f"https://{space.replace('/', '-').replace('_', '-').lower()}.hf.space"
          print(f"Space: https://huggingface.co/spaces/{space}")
          print(f"API:   {url}/predict")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### Deployed\n- Space: https://huggingface.co/spaces/{space}\n- API: `{url}/predict`\n")
          EOF
