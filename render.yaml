services:
  - type: web
    name: veya-inference
    runtime: docker
    # ONNX Runtime build peaks at ~310 MB RAM, so the free 512 MB instance is enough.
    # Free instances sleep after ~15 min idle; first request after that takes ~1 min.
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
